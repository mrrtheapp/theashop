<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THEA SHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1230;--panel:#161d47;--line:#2c3672;--text:#eef1ff;--muted:#9aa4d6;--gold:#ffb21e;--cyan:#38d9f5;--fire:#ff5a36;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Kantumruy Pro","Noto Sans Khmer",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 0}
.logo{display:flex;align-items:center;gap:10px;font-family:Rajdhani,sans-serif;font-weight:700;font-size:1.35rem;letter-spacing:.5px}
.logo svg{width:42px;height:42px;flex:none}
.mid svg{width:64px;height:64px;display:block}
.right{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--gold);color:#1a1300;font-weight:700}
.acct{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 14px;border-radius:8px;font:inherit;font-size:.85rem;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
hr{border:0;border-top:1px solid var(--line);margin:0}
.banner{margin:22px 0;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.banner svg{display:block;width:100%;height:auto}
h2{font-size:1.35rem;margin:0 0 4px}
.game{padding:26px 0}
.gh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.gh .badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:Rajdhani,sans-serif;font-weight:700;font-size:.95rem;color:#fff}
.gh p{margin:0;color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--gold);transform:translateY(-2px)}
.amt{display:flex;align-items:center;gap:6px;font-weight:700;font-size:1.05rem}
.amt svg{width:20px;height:20px}
.price{color:var(--gold);font-family:Rajdhani,sans-serif;font-size:1.3rem;font-weight:700}
.buy{font-size:.78rem;color:var(--muted)}
.slogan{text-align:center;padding:36px 0}
.slogan p{font-size:clamp(1.15rem,3vw,1.6rem);font-weight:700;margin:0 0 6px}
.slogan span{color:var(--muted)}
footer{text-align:center;padding:28px 0 36px}
.tg{display:inline-flex;align-items:center;gap:10px;background:#229ed9;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px}
.tg svg{width:22px;height:22px}
footer small{display:block;color:var(--muted);margin-top:14px}
@media(max-width:640px){header{grid-template-columns:auto 1fr;grid-template-areas:"a c" "b b"}.logo{grid-area:a}.right{grid-area:c}.mid{grid-area:b;justify-self:center}.logo span{font-size:1.1rem}}
@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#ffb21e"/><path d="M24 8l12 10-12 22L12 18z" fill="#1a1300"/><path d="M12 18h24L24 8z" fill="#fff" opacity=".6"/></svg>
    <span>THEA SHOP</span>
  </div>
  <div class="mid">
    <svg viewBox="0 0 64 64" role="img" aria-label="Game"><circle cx="32" cy="32" r="30" fill="#161d47" stroke="#2c3672" stroke-width="2"/><rect x="14" y="22" width="36" height="22" rx="11" fill="#38d9f5"/><rect x="21" y="29" width="3" height="8" fill="#0d1230"/><rect x="18.5" y="31.5" width="8" height="3" fill="#0d1230"/><circle cx="40" cy="30" r="2.5" fill="#0d1230"/><circle cx="44" cy="36" r="2.5" fill="#0d1230"/></svg>
  </div>
  <div class="right">
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="km" aria-pressed="true">ខ្មែរ</button>
      <button data-lang="en" aria-pressed="false">English</button>
    </div>
    <button class="acct" data-i="login">បង្កើត ឬចូលគណនី</button>
  </div>
</header>
</div>
<hr>

<main class="wrap">
  <div class="banner">
    <svg viewBox="0 0 1000 300" role="img" aria-label="Banner">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2bd6"/><stop offset="1" stop-color="#e0431f"/></linearGradient>
      </defs>
      <rect width="1000" height="300" fill="url(#g1)"/>
      <path d="M700 40l90 80-90 150-90-150z" fill="#38d9f5" opacity=".85"/>
      <path d="M610 120h180l-90-80z" fill="#fff" opacity=".5"/>
      <path d="M860 90l45 40-45 75-45-75z" fill="#ffb21e"/>
      <text x="60" y="130" fill="#fff" font-size="54" font-weight="700" font-family="Rajdhani,sans-serif">MOBILE LEGENDS</text>
      <text x="60" y="195" fill="#fff" font-size="54" font-weight="700" font-family="Rajdhani,sans-serif">FREE FIRE</text>
      <text x="60" y="245" fill="#ffe3a0" font-size="26" font-family="sans-serif">Top Up Diamonds</text>
    </svg>
  </div>

  <section class="game" id="mlbb">
    <div class="gh">
      <div class="badge" style="background:#3a2bd6">ML</div>
      <div><h2>Mobile Legends</h2><p data-i="mlsub">ជ្រើសរើសចំនួន Diamonds</p></div>
    </div>
    <div class="grid" data-game="Mobile Legends" data-items="86:1.20,172:2.30,257:3.40,344:4.50,429:5.60,514:6.70,706:9.00,1049:13.50"></div>
  </section>

  <hr>

  <section class="game" id="ff">
    <div class="gh">
      <div class="badge" style="background:#e0431f">FF</div>
      <div><h2>Free Fire</h2><p data-i="ffsub">ជ្រើសរើសចំនួន Diamonds</p></div>
    </div>
    <div class="grid" data-game="Free Fire" data-items="100:1.00,310:3.00,520:5.00,1060:10.00,2180:20.00,5600:50.00"></div>
  </section>
</main>

<hr>
<div class="wrap slogan">
  <p data-i="slogan">ទិញលឿន ទទួលបានភ្លាម</p>
  <span data-i="slogan2">Top up ងាយស្រួល សុវត្ថិភាព តម្លៃសមរម្យ</span>
</div>
<hr>

<footer class="wrap">
  <a class="tg" id="tg" href="https://t.me/yourusername" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M21.9 4.3L2.8 11.6c-1.3.5-1.3 1.3-.2 1.6l4.9 1.5 1.9 5.7c.2.6.4.8.8.8.4 0 .6-.2.9-.4l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.2-15.1c.3-1.3-.5-1.9-1.2-1.5zM9 14.2l9.3-5.9c.4-.3.8-.1.5.2l-7.6 6.9-.3 3.2z"/></svg>
    <span data-i="contact">ទាក់ទងយើងតាម Telegram</span>
  </a>
  <small data-i="foot">© THEA SHOP</small>
</footer>

<script>
var T={
 km:{login:"បង្កើត ឬចូលគណនី",mlsub:"ជ្រើសរើសចំនួន Diamonds",ffsub:"ជ្រើសរើសចំនួន Diamonds",slogan:"ទិញលឿន ទទួលបានភ្លាម",slogan2:"Top up ងាយស្រួល សុវត្ថិភាព តម្លៃសមរម្យ",contact:"ទាក់ទងយើងតាម Telegram",foot:"© THEA SHOP",buy:"ទិញតាម Telegram"},
 en:{login:"Sign up or Log in",mlsub:"Choose your Diamonds amount",ffsub:"Choose your Diamonds amount",slogan:"Buy fast. Get it instantly.",slogan2:"Easy top up, safe, and fair prices",contact:"Contact us on Telegram",foot:"© THEA SHOP",buy:"Buy via Telegram"}
};
var TG="mrrtheappp"; // ប្តូរទៅ username Telegram របស់អ្នក
var lang="km";
var gem='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 7-8 13L4 9z" fill="#38d9f5"/><path d="M4 9h16L12 2z" fill="#fff" opacity=".6"/></svg>';
document.querySelectorAll(".grid").forEach(function(g){
  var game=g.dataset.game;
  g.dataset.items.split(",").forEach(function(s){
    var p=s.split(":");
    var a=document.createElement("a");
    a.className="card";a.target="_blank";a.rel="noopener";
    a.href="https://t.me/"+TG+"?text="+encodeURIComponent(game+" - "+p[0]+" Diamonds ($"+p[1]+")");
    a.innerHTML='<div class="amt">'+gem+p[0]+' Diamonds</div><div class="price">$'+p[1]+'</div><div class="buy" data-i="buy"></div>';
    g.appendChild(a);
  });
});
document.getElementById("tg").href="https://t.me/"+TG;
function setLang(l){
  lang=l;document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=T[l][e.dataset.i]});
  document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===l)});
}
document.querySelectorAll("[data-lang]").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.lang)})});
setLang("km");
</script>
</body>
</html>
